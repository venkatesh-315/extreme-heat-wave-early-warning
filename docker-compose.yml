services:
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: thermoguard-ml-service
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - PORT=8000
      - HOST=0.0.0.0
      - CORS_ORIGINS=http://localhost:5000,http://localhost:5173,http://backend:5000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  mongodb:
    image: mongo:7.0-jammy
    container_name: thermoguard-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: thermoguard-backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/thermoguard
      - ML_SERVICE_URL=http://ml-service:8000
      - CORS_ORIGIN=http://localhost:5173,http://127.0.0.1:5173
    depends_on:
      ml-service:
        condition: service_healthy
      mongodb:
        condition: service_started
    restart: unless-stopped

volumes:
  mongo_data:
